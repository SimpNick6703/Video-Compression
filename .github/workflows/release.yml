name: Build & Release

on:
  release:
    types: [created]
  workflow_dispatch:

# Critical: Grant write permission to upload assets to the Release
permissions:
  contents: write

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install rich pyinstaller

      - name: Install FFmpeg Runtime Libraries (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libva2 libva-drm2 libdrm2

      - name: Build Executables
        env:
          BUILD_VERSION: ${{ github.ref_name }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python build.py

      - name: Build Windows Installer
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          BUILD_VERSION: ${{ github.ref_name }}
        run: |
          choco install innosetup -y --no-progress
          $exe = Get-ChildItem dist -Filter "100mb-hevc-win64*.exe" | Select-Object -First 1
          if (-not $exe) { throw "100mb-hevc Windows executable not found in dist" }
          $version = $env:BUILD_VERSION.TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" "/DSourceExe=$($exe.FullName)" installer\windows.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC failed with exit code $LASTEXITCODE" }

      # --- Upload Section ---

      - name: Upload Artifacts (to Actions Run)
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.os }}
          path: dist/*

      - name: Upload to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
